name = "isg-vision"
version = "0.1.0"
description = "Yapay Zeka Destekli Coklu Calisan Tanima ve ISG Denetim Sistemi (bitirme projesi)"
requires-python = ">=3.11,<3.13"
# Bagimliliklar requirements.txt dosyasinda tutulur.

[tool.setuptools.packages.find]
where = ["src"]
