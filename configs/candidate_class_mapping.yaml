# Aşama 2 - ADAY sınıf eşleme taslağı (KESİNLEŞMİŞ DEĞİL; hiçbir etiket yeniden yazılmadı / dönüştürülmedi).
# Hedef sınıflar: 0 helmet, 1 no_helmet, 2 vest, 3 no_vest
#
# Önerilen hedef kutu tanımı (bu aşamada UYGULANMADI; kullanıcı kararı gerekir):
#   helmet    = baret nesnesinin kendisi (sıkı kutu)        no_helmet = baretsiz BAŞ bölgesi (saç/yüz dahil)
#   vest      = yelekli gövde bölgesi                       no_vest   = yeleksiz gövde bölgesi
#
# status (Aşama 2 eksik giderme, küçük harfli sözlük):
#   confirmed    : kutu tanımı hedefle tutarlı (nicel ölçü + görsel inceleme + dokümantasyon) VE örneklemde olası hata <= %10
#   needs_review : tanım tutarlı görünüyor ama etiket kalitesi/örneklem belirsiz (belirsiz >= %30 veya olası hata > %10) ya da kanıt yetersiz
#   incompatible : kutu tanımı hedefle tutarsız veya hedef dışı sınıf; DOĞRUDAN birleştirilmemeli
# compatibility: Uyumlu | Uyumsuz | Karar verilemedi   (kutu semantiği açısından)
# reliability  : kanıtın güvenilirliği (Yüksek | Orta | Düşük)
# user_review "Pending" her satır için geçerlidir (kullanıcı onayı bekler).
#
# NOT (düzeltme): İlk Aşama 2 taslağı kutu semantiğini medyan "görüntü alanı" ile karşılaştırmıştı; bu ölçü kadraj yakınlığından
# etkilendiği için yanıltıcıydı (ör. 'no_helmet helmet'ten 4x küçük' ve 'no_vest vest'ten 3x büyük' sonucu). Şimdiki kanıt
# kişi kutusuna göre göreli boyutlar ve baş/gövde oranlarıdır (semantic_metrics.json). Görsel kayıtlar:
# configs/review/label_review_verdicts.yaml ve reports/dataset_audit/semantic_validation_report.md.

target_classes: {0: helmet, 1: no_helmet, 2: vest, 3: no_vest}

mappings:
  # ---------------- Ultralytics Construction-PPE ----------------
  - {dataset: construction_ppe, id: 0, name: helmet, target: 0, status: confirmed, compatibility: Uyumlu, reliability: Yüksek,
     box_semantics: "Baret nesnesinin kendisi (sıkı kutu); kişiye göre yükseklik 0.13, en-boy h/w=0.85 (baş-baret genişten yüksek değil)",
     visual_result: "24 kırpma + karşılaştırma sayfası (8/8): kutu bareti sıkı sarıyor, yüz/boyun dahil değil",
     inconsistencies: "Elde TAŞINAN baret de 'helmet' (14 görüntü, çelişki incelemesinde doğrulandı): sınıf 'takılı baret' değil 'baret nesnesi' anlamında",
     evidence: "Resmi doküman + semantic_metrics.json (person_relative) + görsel inceleme",
     risk: "Taşınan baretler 'baret takıyor' kararını yanıltabilir; kişi-ekipman eşleştirmesinde baş bölgesiyle konum kontrolü gerekir"}
  - {dataset: construction_ppe, id: 6, name: no_helmet, target: 1, status: confirmed, compatibility: Uyumlu, reliability: Yüksek,
     box_semantics: "Baretsiz tüm BAŞ (saç/yüz); kişiye göre yükseklik 0.17, h/w=1.10",
     visual_result: "8/8 karşılaştırma + 24 kırpma: kutu başı (alından çeneye) sarıyor; kişinin tamamı değil",
     inconsistencies: "Çok küçük/bulanık/arkadan baş örnekleri; bir örnekte koyu başlık benzeri nesne no_helmet olabilir",
     evidence: "Resmi doküman ('visible head without a helmet') + ölçü + görsel",
     risk: "Başlıklı (şapka) baş etiketi kullanımı belirsiz"}
  - {dataset: construction_ppe, id: 2, name: vest, target: 2, status: confirmed, compatibility: Uyumlu, reliability: Yüksek,
     box_semantics: "Yelekli gövde; kişi yüksekliğinin ~%40'ı, üstten %15 aşağıda başlıyor",
     visual_result: "8/8 + 24 kırpma: kutu yelekli gövdeyi sarıyor",
     inconsistencies: "Yok (kişi dışı kutu görülmedi)",
     evidence: "semantic_metrics.json + görsel (resmi doküman vest için kutu tanımı vermiyor)",
     risk: "Doküman vest kutusunu tanımlamıyor; kanıt ölçü+görsel"}
  - {dataset: construction_ppe, id: 11, name: no_vest, target: 3, status: confirmed, compatibility: Uyumlu, reliability: Yüksek,
     box_semantics: "Yeleksiz GÖVDE; kişiye göre yükseklik 0.40 (vest ile aynı), tüm kişi değil",
     visual_result: "8/8 + 24 kırpma: kutu göğüs-bel gövdesini sarıyor",
     inconsistencies: "Yok",
     evidence: "Resmi doküman ('visible torso without high-visibility safety clothing') + ölçü + görsel",
     risk: "Oklüzyon tek başına 'yelek yok' kanıtı değil (dokümanın kendi uyarısı)"}
  - {dataset: construction_ppe, id: 1, name: gloves, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Eldiven", visual_result: "—", inconsistencies: "Hedef dört sınıfta karşılığı yok", evidence: "Sınıf adı/YAML", risk: "Birleştirmede dışarıda bırakılmalı"}
  - {dataset: construction_ppe, id: 3, name: boots, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Bot", visual_result: "—", inconsistencies: "Hedef dışı", evidence: "Sınıf adı/YAML", risk: ""}
  - {dataset: construction_ppe, id: 4, name: goggles, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
