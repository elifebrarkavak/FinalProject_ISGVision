     visual_result: "8/8 + 24 kırpma: gövde kutuları; çoğu sıradan kıyafetli (inşaat dışı) kişi",
     inconsistencies: "KKD gerektiren bağlam çoğu görüntüde yok: 'yelek yok' ama yelek zorunlu bir ortam olmayabilir",
     evidence: "Baş/gövde oranı + görsel",
