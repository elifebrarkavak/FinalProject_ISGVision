  - {dataset: construction_ppe, id: 5, name: Person, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Tüm kişi", visual_result: "—", inconsistencies: "Hedef dışı",
     evidence: "Sınıf adı/YAML", risk: "İnsan tespiti projede ayrı modülde (human_detection) yapılacak; kullanım kararı bekliyor"}
  - {dataset: construction_ppe, id: 7, name: no_goggle, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Gözlüksüz göz bölgesi", visual_result: "—", inconsistencies: "Hedef dışı", evidence: "Sınıf adı/YAML", risk: ""}
  - {dataset: construction_ppe, id: 8, name: no_gloves, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Eldivensiz el", visual_result: "—", inconsistencies: "Hedef dışı", evidence: "Sınıf adı/YAML", risk: ""}
  - {dataset: construction_ppe, id: 9, name: no_boots, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Botsuz ayak", visual_result: "—", inconsistencies: "Hedef dışı", evidence: "Sınıf adı/YAML", risk: ""}
  - {dataset: construction_ppe, id: 10, name: forklift, target: null, status: incompatible, compatibility: Uyumsuz, reliability: Yüksek,
     box_semantics: "Forklift", visual_result: "—", inconsistencies: "Hedef dışı", evidence: "Sınıf adı/YAML", risk: ""}

