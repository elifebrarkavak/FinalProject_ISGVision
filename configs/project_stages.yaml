# Aşama 5B bilinen sınırlamalar (ayrıntı: docs/face_association.md bölüm 12).
stage5b_known_limitations:
  KL-5B-001: {title: "Yüz-kişi bağı kimlik veya canlı insan doğrulaması DEĞİLDİR: poster/basılı fotoğraf/ekrandaki yüz bir kişi kutusunun kafa bölgesine denk gelirse bağlanır; geometri bunu ayıramaz (possibly_static yalnızca kalıcı hareketsiz izleri bayraklar, yargı değildir). Gerçek poster/telefon test edilmedi", status: open_known_limitation}
  KL-5B-002: {title: "ID switch/devralma 4B sınırlamasıdır ve ÇÖZÜLMEDİ (KL-4B-001/003/009/010): 5B yanlış taşımayı önler (eşleşme her karede yeniden kurulur; epoch/trusted ile işaretler) ama ID switch'i önlemez", status: open_known_limitation}
  KL-5B-003: {title: "Belirsizlik politikası muhafazakârdır: çekişmeli yüz/kişi (yakın skor, yinelenen kutu, kafa hizası yakın örtüşme) eşleştirilmez; bazı gerçek eşleşmeler 'ambiguous' kalır (kasıtlı; maliyet gerçek veride ölçülmedi)", status: open_known_limitation}
  KL-5B-004: {title: "Süreklilik eşikleri muhafazakârdır: hızlı hareket veya kadraj kenarında kırpılan kutu yanlış 'jump' alarmı üretebilir (sentetik leave_and_return'da 7 jump); bedeli yalnızca kaybedilen güven karesidir", status: open_known_limitation}
  KL-5B-005: {title: "Kanıt sınırı: gerçek fotoğraflar + SENTETİK MONTAJ (aynı üç kırpıntı, piksel-aynı kareler, kaydırma; yüz maskeleme/poster taklitleri). Gerçek kamera kanıtı YALNIZCA tek kişilik nitel kullanıcı bildirimi + iki ekran görüntüsü + iki iz özetidir; gerçek çoklu-kişi, gerçek poster ve yüksek açı kanıtı yok; doğruluk/ID switch oranı ölçülmedi", status: open_known_limitation}
  KL-5B-006: {title: "Skor ağırlıkları ve plato sınırları anatomik/kamera geometrisi gerekçeli başlangıç değerleridir; optimize edilmedi. Skor kimlik doğruluğu veya olasılık DEĞİLDİR ve yüz tespit güvenini içermez", status: open_known_limitation}
  KL-5B-007: {title: "--opencv-threads süreç geneli bir ayardır (yalnızca ultralytics içe aktarımından SONRA anlamlı); varsayılan 'keep'; eğitim süreçlerinde kullanılmamalı; getNumThreads() yavaşlamanın güvenilir göstergesi değildir", status: open_known_limitation}
  KL-5B-008: {title: "Kayıtlı videodan ölçülen FPS/süreler canlı kamera ölçümü DEĞİLDİR; YuNet yalnızca CPU'dadır (KL-5A-007); ilişkilendirme O(kişi x yüz) (60x60'ta ~3,8 ms)", status: open_known_limitation}
  KL-5B-009: {title: "Gerçek kamerada tek kişide EK/çakışan insan kutuları ve bunun sonucu yüzün 'ambiguous' kalıp eşleştirilmemesi gözlendi (kullanıcı ekran görüntüleri); kök neden ayrıştırılmadı, sıklığı ölçülmedi, ÇÖZÜLMEDİ (OT-5B-009/012). trusted=False eşleşmeler (1. koşuda ana iz eşleşmelerinin 149/448'i) kimlik kanıtı sayılmamalıdır", status: open_known_limitation}

# Aşama 3 kapsamı DIŞINDA kalanlar (kullanıcı talimatı)
stage3_excludes: ["YOLO eğitimi", "veri seti birleştirme", "model doğruluğu değerlendirmesi"]
