# Projenin 12 aşamalı geliştirme planı — TEK REFERANS (kullanıcı tarafından belirlendi, 2026-11-11).
# Belgelerdeki aşama numaraları bu dosyayla tutarlı olmalıdır (denetim: scripts/run_stage2c_checks.py T2D.2,
# tests/test_stage2d_review.py). İnsan tarafından okunur sürüm: docs/project_plan.md

stages:
  1: {title: "Proje ortamının hazırlanması", status: completed}
  2: {title: "Veri setlerinin analizi ve doğrulanması", status: completed}
  3: {title: "Canlı kamera altyapısı", status: completed}
  4: {title: "Çoklu insan tespiti ve takibi", status: completed}   # 4A ve 4B alt aşamaları: aşağıdaki stage4_substages; 4 yalnızca 4B de COMPLETED olunca COMPLETED olur (4B COMPLETED: 2026-11-13, kullanıcı onayıyla; kapsam içi prototip, açık sınırlamalarla)
  5: {title: "Çoklu yüz tespiti", status: planned}
  6: {title: "Çalışan kayıt sistemi", status: planned}
  7: {title: "Çoklu çalışan kimlik tanıma", status: planned}
  8: {title: "İlk YOLO İSG modelinin eğitilmesi", status: planned}
  9: {title: "Veri setlerinin birleştirilmesi", status: planned}
  10: {title: "Geliştirilmiş YOLO İSG modelinin eğitilmesi", status: planned}
  11: {title: "Kimlik tanıma ve İSG kontrolünün birleştirilmesi", status: planned}
  12: {title: "Canlı arayüz, sistem testleri ve raporlama", status: planned}

# Aşamalara bağlı kurallar (belgelerde bu numaralar kullanılır)
milestones:
  camera_infrastructure: 3          # OpenCV kamera erişimi, video akışı, FPS, kamera hata yönetimi, çoklu kişi analizi için akış altyapısı
  first_yolo_training: 8            # ilk YOLO İSG eğitimi; türetilmiş eğitim verisi ve manifest tabanlı sınıf dönüşümü bu aşamanın hazırlığında
  dataset_merge: 9                  # Mendeley/Roboflow ancak lisans/hak doğrulanırsa; birleşik bölme G1-G6 ile
  improved_yolo_training: 10
  identity_ppe_integration: 11      # kişi düzeyi İSG kararı (yüz/kimlik + baret/yelek ilişkilendirmesi)
  live_system_tests: 12             # canlı arayüz, uçtan uca sistem testleri, nihai raporlama

# Aşama 3 kapanışında (2026-11-11, kullanıcı onayıyla) ERTELENEN maddeler ve planlanan değerlendirme aşamaları.
# Bunlar yapılmamıştır; tamamlanmış sayılmaz. Ayrıntı: reports/camera/STAGE_3_REPORT.md K.2, docs/project_plan.md.
stage3_deferred_backlog:
  B3-1: {title: "Otomatik yeniden bağlanma", target_stages: [12]}
  B3-2: {title: "Kare kaybı ölçümü", target_stages: [4, 12]}
  B3-3: {title: "Gecikme ölçümü", target_stages: [4, 12]}
  B3-4: {title: "Gerçek kamera FPS'inin ileri doğrulaması", target_stages: [4, 12]}
  B3-5: {title: "Fiziksel bağlantı kopması testi", target_stages: [12]}
# 4B notu (2026-11-12): B3-3 yalnızca kayıtlı videoda (kare->takip sonucu gecikmesi) ölçüldü, canlıda bildirilmedi; B3-4 kısmen (kullanıcının canlı koşuları, bağımsız zaman referansı yok); B3-2 yapılmadı. Hepsi ertelenmiş kalır (OT-4B-004).

# Aşama 4 alt aşamaları (kullanıcı kararı, 2026-11-12): 4A çoklu insan tespiti, 4B çoklu insan takibi. Aşama 4 genel durumu, 4B COMPLETED olana kadar COMPLETED OLMAZ (kural korunuyor; 4B 2026-11-13'te COMPLETED olduğu için Aşama 4 de COMPLETED).
# 4A: COMPLETED (2026-11-12) — yalnızca kapsam içi prototip geliştirme ve doğrulama: kod, otomatik testler, gerçek model doğrulamaları ve kullanıcının MacBook kamerasıyla yaptığı manuel testler tamam.
# Kapanışta açık kalanlar aşağıdaki stage4a_open_items / stage4a_known_limitations içindedir (tamamlanmış sayılmaz). (4A kapanışı sırasında 4B henüz başlatılmamıştı.)
# Ayrıntı: reports/detection/STAGE_4A_REPORT.md, docs/person_detection.md
# 4B: COMPLETED (2026-11-13; kullanıcı onayıyla; YALNIZCA kapsam içi prototip geliştirme ve doğrulama). Önceki durum: READY_FOR_MANUAL_VERIFICATION (2026-11-12).
# Dayanak: ilk 4B görev tanımındaki 28 kabul kriterinin 28'i karşılandı — 24'ü TAM kanıtlı, 4'ü (#9 tek insan, #17 yorgan riski, #19 FPS/gecikme, #21 çıkış yöntemleri) SINIRLI kanıtlı (canlı kamera kanıtı eksik/kısmi; tam doğrulanmış sayılmaz).
# Canlı MacBook kamerası (kullanıcı) KISMEN: pencereli MPS 2924 kare 16,3 FPS, penceresiz CPU/MPS 29,9 FPS (iki gerçek kişi, 300'er karede 2 ID), Q ile çıkış; 2026-11-13: çoklu takip çalışıyor, örtüşme ve kadrajdan çıkıp-girişte ID değişimleri gözlendi (nitel; oran ölçülmedi).
# YAPILMAYAN/ÖLÇÜLMEYEN (başarılı sayılmaz, açık görev olarak taşınır): üç kişi canlı testi, yüksek açı, yorgan, Esc/kırmızı düğme/Ctrl+C gerçek kamerada, poster T1/T2 (test ortamı değişti), ID switch oranı, IDF1/HOTA/MOTA.
# Poster yanlış pozitifi FP-4B-001 AÇIK ve ÇÖZÜLMEDİ; kapanış engeli değildir (kullanıcı kararı). Aşağıdaki stage4b_* bölümlerine bakın.
# Ayrıntı: reports/tracking/STAGE_4B_REPORT.md (bölüm 29), reports/tracking/STAGE_4B_CLOSURE_ASSESSMENT.md, docs/person_tracking.md
stage4_substages:
  4A: {title: "Çoklu insan tespiti", status: completed}
  4B: {title: "Çoklu insan takibi", status: completed}   # 2026-11-13, kullanıcı onayı; kapsam içi prototip, açık sınırlamalarla (stage4b_known_limitations, stage4b_open_items)

# Aşama 4A kapanışında (2026-11-12) AÇIK kalan görevler. OT-4A-001 kapanıştan sonra kullanıcı tarafından test edildi ama sorunu çözmedi; diğerleri yapılmamıştır. Hiçbiri tamamlanmış sayılmaz.
stage4a_open_items:
  OT-4A-001: {title: "PENDING_MANUAL_TEST — CONFIDENCE_THRESHOLD_0_35: kullanıcı tarafından gerçekleştirildi (kapanış sonrası); yorgan conf 0.35'te de kısa süreliğine insan sanıldı (süre gözle daha kısa, ölçülmedi); FP-4A-001 çözülmedi; gerçek insan tespitinin başarısı ölçülmedi; varsayılan conf 0.25 değişmedi", status: test_performed}
  OT-4A-002: {title: "Bağımsız etiketli değerlendirme kümesi ve resmî doğruluk ölçümleri (Precision, Recall, F1, mAP)", status: open}
  OT-4A-003: {title: "Gerçek IP kamera doğrulaması (kurulum, RTSP, nihai açı, gecikme, görüntü kalitesi)", status: deferred_to_system_integration, target_stages: [11, 12]}
  OT-4A-004: {title: "OBS-4A-001: ilk canlı oturumdaki en yüksek 7 tespit sayısının araştırılması (doğrulanmamış gözlem)", status: open_investigation}
  OT-4A-005: {title: "OBS-4A-004: yeni ortamda arka plandaki çok küçük görünen kişilerin kutulanmaması; boyut (imgsz 640/960/1280), conf ve görünürlük etkilerinin araştırılması (plan: docs/person_detection.md 14.4); eşik/algoritma değişikliği YAPILMADI; yanlış pozitif kararlarıyla (FP-4A-001, FP-4B-001) birlikte değerlendirilmeli", status: open_investigation}

# Aşama 4A kapanış SONRASI gözlemler (kullanıcı, yeni test ortamı, 2026-11-12). 4A COMPLETED durumu ve varsayılan ayarlar değişmedi.
stage4a_observations:
  OBS-4A-003: {title: "Yeni ortamda 4A betiğiyle gerçek kamera testi (4B T1 kapsamında): YOLO11n MPS 1280x720, 1812 kare, 82,7 sn, 21,9 FPS, ort. çıkarım 15,9 ms, kare başına ort. 2,89 ve en çok 7 kişi; ön plandaki iki kişi 0,85/0,87 ve 0,80/0,66 ile ayrı algılandı; telefondaki insan fotoğrafı ayrı tespit oluşturmadı (tek kare). Ort. 2,89 / en çok 7 yanlış pozitif OLARAK YORUMLANMAZ (arka planda gerçek kişiler vardı). Önceki poster aynı şartlarda yeniden kurulamadığı için T1 poster karşılaştırması TAMAMLANMADI", status: recorded}
  OBS-4A-004: {title: "Arka plandaki çok küçük görünen kişiler kutulanmadı (yeni ortam; boyut/mesafe bildirilmedi); nedeni araştırılmadı; kameasız ön prob imgsz 640'ta ~90-120 px altı kişi boyunda algılamanın düştüğünü gösterdi (iyimser koşul, kullanıcı sahnesi değil)", status: open_investigation}

# Bilinen sınırlamalar / gözlemler (Aşama 4A kapanışı).
stage4a_known_limitations:
  FP-4A-001: {title: "Yorgan/kumaş kısa süreli insan olarak tespit edildi (conf 0.25, MacBook ≈2 m yükseklikte; conf 0.35'te de kısa süreliğine görüldü, süre gözle daha kısa ama ölçülmedi; çözülmedi; tek kullanıcı gözlemi)", status: open_known_limitation}

# Aşama 4B AÇIK görevler (2026-11-12; kapanış 2026-11-13). Hiçbiri tamamlanmış sayılmaz; 4A'nın açık görevleri (OT-4A-002/003/004, FP-4A-001) aynen geçerlidir.
# closure_blocking: false = 4B'nin COMPLETED kararını engellemedi (kullanıcı kararı + ilk görev tanımındaki 28 kabul kriteri); görev AÇIK kalır, başarılı/tamamlanmış sayılmaz.
stage4b_open_items:
  OT-4B-001: {title: "Gerçek MacBook kamerası manuel testleri (docs/person_tracking.md bölüm 17). YAPILAN (kullanıcı): pencereli MPS oturumu (2924 kare), Q ile sorunsuz çıkış; iki gerçek kişi penceresiz 300'er karede 2 ID; 2026-11-13: çoklu takip çalışıyor, örtüşme ve kadrajdan çıkıp-girişte ID değişimleri gözlendi (NİTEL; sayı/hız/kenar kaydı yok, başarılı/başarısız etiketi yok). KALAN/bildirilmeyen: tek kişi kontrol listesi, üç kişi (kaç kişi olduğu belirsiz), yüksek kamera açısı (~2 m), Esc/kırmızı düğme/Ctrl+C ile çıkış (gerçek kamerada), çıkış kodu ve kameranın serbest kalması (≈10 dk'lık isteğe bağlı teyit önerilir)", status: partially_performed, closure_blocking: false}
  OT-4B-002: {title: "Yorgan yanlış pozitifi gözlemi (Manuel Test 7): yorgan Track ID alıyor mu, kaç kare/saniye sürüyor, --new-track-thresh 0.6 etkisi ve gerçek kişi üzerindeki bedeli; YAPILMADI; FP-4A-001 ile birlikte açık taşınır (araştırma görevi); FP-4A-001 çözülmedi", status: open, closure_blocking: false}
  OT-4B-003: {title: "Takip doğruluğu: etiketli/izinli değerlendirme videosuyla ID switch oranı ve IDF1/HOTA/MOTA — ÖLÇÜLMEDİ (etiketli takip verisi yok; hiçbir değer üretilmedi; %85 hedefi karşılandı denmez). Örtüşme/çıkış-giriş ID değişimlerinin SIKLIĞI bilinmiyor; küçük kontrollü değerlendirme videosu planı: docs/person_tracking.md bölüm 14", status: open, closure_blocking: false}
  OT-4B-004: {title: "Canlı kamera performansı. YAPILAN (kullanıcı): pencereli MPS 16,3 FPS (YOLO 17,7 / ByteTrack 0,5 ms), penceresiz CPU 29,9 FPS (18,5 / 0,2 ms), penceresiz MPS 29,9 FPS (14,7 / 0,4 ms). EKSİK: okuma/çizim/gösterme/kare->sonuç satırları (canlı kare->sonuç gecikmesi bildirilmedi), pencereli CPU, ham kamera ölçümü aynı oturumda; backlog B3-3 ve B3-4 ile ilişkili (ertelenmiş)", status: partially_performed, closure_blocking: false}
  OT-4B-005: {title: "ARAŞTIRMA GÖREVİ — Poster/çakışan büyük kutu tanısı: kaynak YOLO tespiti mi ByteTrack mi? Test planı T0-T7 hazır (docs/person_tracking.md bölüm 21, rapor bölüm 26). Test ortamı değişti, poster artık kamerada yok: poster için aynı koşullardaki T1/T2 yeniden doğrulaması YAPILAMIYOR (yapılmadı; tamamlanmış/başarılı değil). Yeni ortamdaki kısmi T1 (OBS-4A-003, telefondaki fotoğraf) poster karşılaştırması DEĞİLDİR. T0, T2-T7 yapılmadı. Plan, ileride görülecek başka bir statik yanlış pozitif (ör. poster/yorgan benzeri) için geçerlidir; eşik/filtre çözümleri doğrulama ve kabul ölçütü (rapor bölüm 27) olmadan UYGULANMAZ", status: open_research_task, closure_blocking: false}

# Aşama 4B canlı gözlemler (kullanıcı, gerçek MacBook kamerası). Hiçbiri çözülmüş sayılmaz.
stage4b_observations:
  FP-4B-001: {title: "Panodaki basılı erkek fotoğrafı insan olarak algılandı ve Track ID aldı (ID 167; pencereli MPS oturumu, 2026-11-12; kullanıcının ekran görüntüsüyle doğrulanmış gözlem; ekran görüntüsü depoda yok; güveni ve kaç kare sürdüğü bildirilmedi). 2026-11-13: test ortamı değişti, poster artık kameranın arka planında değil; AYNI KOŞULLARDA T1/T2 YENİDEN DOĞRULAMASI YAPILAMADI. Sorun ÇÖZÜLMEDİ; kaynak (YOLO/ByteTrack) ayrıştırılmadı; 4B kapanışını engellemez (kullanıcı kararı)", status: open_known_limitation}
  OBS-4B-001: {title: "İki gerçek kişi varken dört aktif Track ID ve gerçek kişiler üzerinde çakışan büyük takip kutuları; ACTIVE <= DETECTIONS değişmezi gereği en az dört YOLO kutusu vardı; kutuların ham YOLO çıktısında olup olmadığı ayrıştırılmadı (OT-4B-005); ortam değiştiği için aynı koşullarda yeniden doğrulanamıyor", status: open_investigation}
  OBS-4B-002: {title: "Pencereli canlı FPS 16,3 vs penceresiz 29,9 (2924 vs 300 kare, farklı oturumlar); imshow+waitKey(1) kameasız ortamda ~15-17 ms ölçüldü; fark tam açıklanmadı; 4A pencereli 18,4-25,3 FPS ile aynı aile", status: open_investigation}
  OBS-4B-003: {title: "Kullanıcı gözlemi (2026-11-13, gerçek kamera): çoklu insan takibi çalışıyor; örtüşme sırasında ve kadrajdan çıkıp yeniden girişte ID değişimleri gözlendi. NİTEL kayıt: kişi sayısı, değişim sayısı/sıklığı, kenar/süre, cihaz bildirilmedi; sayı veya oran üretilmedi. KL-4B-001/003 ile uyumlu (KL-4B-009/010)", status: recorded}

# Aşama 4B bilinen sınırlamalar (ayrıntı: reports/tracking/STAGE_4B_REPORT.md bölüm 20, docs/person_tracking.md bölüm 16).
stage4b_known_limitations:
  KL-4B-001: {title: "ID'ler konuma yapışır (ByteTrack görünüm kullanmaz): hızlı/anlık yer değiştirmede ID switch; tampon içinde kaybolanın konumuna giren kişi eski ID'yi devralır", status: open_known_limitation}
  KL-4B-002: {title: "Kalıcı (statik) yanlış pozitif sürekli Track ID alır; ByteTrack yalnızca tek karelik tespitleri eler (FP-4A-001 çözülmedi)", status: open_known_limitation}
  KL-4B-003: {title: "Kadrajdan çıkıp aynı kenardan dönen kişi tampon süresi dolmadan bile yeni ID alır", status: open_known_limitation}
  KL-4B-004: {title: "Düşük güvenli kurtarma aşaması varsayılan conf 0.25 ile fiilen kapalı; açmak şüpheli iz ömrünü uzatır, yararı gösterilemedi", status: open_known_limitation}
  KL-4B-005: {title: "track_buffer kare sayısıdır (FPS'e bağlı süre); oturumun ilk karesi onaysız iz alır; çıktı kutusu Kalman tahminidir; hızlı hareket (düşük IoU) iz oluşturmaz", status: open_known_limitation}
  KL-4B-006: {title: "BYTETracker/Boxes dahili Ultralytics API'sidir (ultralytics==8.4.210'a sabit; sürüm riski); AGPL-3.0 yükümlülükleri ürünleştirmede yeniden değerlendirilmeli", status: open_known_limitation}
  KL-4B-007: {title: "Kanıt sınırı: gerçek-ByteTrack senaryoları idealize sentetik, gerçek-model testleri örnek görüntülerden; gerçek kamerada ID sürekliliği ve IDF1/HOTA ölçülmedi", status: open_known_limitation}
  KL-4B-008: {title: "ByteTrack çakışan/iç içe kutuları birleştirmez ve yanlış pozitifi süzmez: kararsız yinelenen veya kalıcı yanlış pozitif kutu kalıcı ek Track ID alır (poster, yorgan); eşik değişiklikleri gerçek kişi kaybettirebilir (montajda ölçüldü)", status: open_known_limitation}
  KL-4B-009: {title: "Örtüşme sırasında Track ID değişimi (ID switch / devralma) gerçek kamerada gözlendi (kullanıcı, 2026-11-13; NİTEL). ByteTrack görünüm kullanmadığı için beklenen davranıştır (KL-4B-001). ID switch ORANI ölçülmedi; sıklık ve koşullar kayıtlı değil. Track ID kalıcı bir kişi kimliği olarak kullanılamaz", status: open_known_limitation}
  KL-4B-010: {title: "Kadrajdan çıkıp yeniden girişte yeni Track ID oluşması gerçek kamerada gözlendi (kullanıcı, 2026-11-13; NİTEL; KL-4B-003 ile uyumlu). Hangi kenar/süre koşullarında olduğu kayıtlı değil; oran ölçülmedi. Yeniden giriş aynı kişi olarak ilişkilendirilmez", status: open_known_limitation}

# Aşama 5 için tasarım notları (4B kapanışı, 2026-11-13; kullanıcı talimatı). Aşama 5 BAŞLATILMADI, kod yazılmadı; bunlar yalnızca girdi notlarıdır. Ayrıntı: docs/person_tracking.md bölüm 18, rapor bölüm 22.
stage5_design_notes:
  N5-1: {title: "Geçici Track ID, kayıtlı çalışan kimliği DEĞİLDİR; ikisi ayrı kavramdır. Track ID oturum kapsamlıdır, anahtar (session_id, track_id); çalışan adı/personel numarası/biyometrik kimlik içermez ve çalışan kaydıyla (Aşama 6) doğrudan eşlenmez"}
  N5-2: {title: "ID değişimleri (örtüşme, yer değiştirme, kadrajdan çıkıp-giriş) gerçek kamerada gözlendi: bir yüzü/çalışanı iz ID'sine kalıcı bağlamak yanlış çalışan eşleştirmesine yol açabilir. Tek kare yerine çok kareli doğrulama, iz değişince/kaybolunca eşleşmeyi geçersiz kılma ve belirsizlikte eşleştirmeme (güvenli varsayılan) tasarlanmalı"}
  N5-3: {title: "Yanlış pozitif iz (poster/yorgan, FP-4B-001/FP-4A-001) üzerindeki yüz bir çalışana bağlanmamalı; kalıcı hareketsiz iz bayrak (silme değil) adayıdır. Yanlış pozitif kaynağı (OT-4B-005) ayrıştırılmadı"}

# Aşama 3 kapsamı DIŞINDA kalanlar (kullanıcı talimatı)
stage3_excludes: ["YOLO eğitimi", "veri seti birleştirme", "model doğruluğu değerlendirmesi"]
