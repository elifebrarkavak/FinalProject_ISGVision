# Aşama 5A bilinen sınırlamalar (ayrıntı: docs/face_detection.md bölüm 10).
stage5a_known_limitations:
  KL-5A-001: {title: "Yüz tespiti kimlik veya canlı insan doğrulaması DEĞİLDİR: poster/basılı fotoğraf/ekrandaki yüz de tespit edilir (gerçek poster test edilmedi; montajlardaki fotoğraf-içi-fotoğraf yüzler bulundu). Aşama 4B'nin açık yanlış pozitif sorunları (FP-4B-001, FP-4A-001) ÇÖZÜLMEDİ", status: open_known_limitation}
  KL-5A-002: {title: "Doğruluk ölçülmedi; referans kutular bağımsız etiket değil (modelin kutuları görüntüde gözle doğrulandı); güven skoru kalibre değil", status: open_known_limitation}
  KL-5A-003: {title: "Test verisi yetersiz (iki örnek fotoğraf ve türevleri; aynı iki yüz tekrarlanan sentetik montaj)", status: open_known_limitation}
  KL-5A-004: {title: "Düzlem içi 60/90 derece dönmüş yüzler kaçtı (tek görüntüde ölçüldü); yaw/pitch açıları ölçülmedi", status: open_known_limitation}
  KL-5A-005: {title: "Kadraj kenarı: yüzün ~%46'sı (sol) veya ~%29'u (üst) kesilince bulundu, ~%90 (sol) veya ~%75 (üst) kesilince bulunamadı (tek görüntü); at_border sezgiseldir", status: open_known_limitation}
  KL-5A-006: {title: "Çok bulanık arka plan yüzleri conf 0,6'da kabul edilebilir (zidane.jpg'de 0,61); gerçek yüz mü yanlış pozitif mi belirsiz", status: open_known_limitation}
  KL-5A-007: {title: "Yalnızca CPU: OpenCV 5.0 DNN'de MPS hedefi yok, OpenCL hedefi etkisiz (ölçüldü), klasik motor bu modelle hata veriyor; ultralytics içe aktarılırsa OpenCV tek iş parçacığına düşer ve YuNet ~2,7x yavaşlar", status: open_known_limitation}
  KL-5A-008: {title: "--detect-width küçük/uzak yüzleri kaçırabilir; etkisi sahneye bağlı (sentetik 4 yüzlü montajda 640'a kadar kayıp yok, zidane'da 640'ta bulanık yüz kayboldu)", status: open_known_limitation}
  KL-5A-009: {title: "Yüz işaret noktası, poz, kalite, canlılık, kareler arası tutarlılık ve yüz izleme yok; toplam yüz sayısı benzersiz kişi sayısı değildir; yüz-kişi/Track ID eşleştirmesi 5A'da YOKTUR (5B)", status: open_known_limitation}
  KL-5A-010: {title: "Gerçek kamerada yalnızca tek kişilik nitel yüz tespiti doğrulandı (kullanıcı); çoklu yüz, mesafe, açı ve yüksek kamera açısı (~2 m) testi yapılmadı", status: open_known_limitation}

